appId: com.hiredheist.vestibule
productName: Vestibule
copyright: Copyright © 2026 Hired Heist

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json

win:
  target:
    - nsis
    - portable
  icon: public/vestibule/icon.png

mac:
  target:
    - dmg
  icon: public/vestibule/icon.png
  category: public.app-category.games

linux:
  target:
    - AppImage
    - deb
  icon: public/vestibule/icon.png
  category: Game

nsis:
  oneClick: true
  allowToChangeInstallationDirectory: false
  installerIcon: public/vestibule/icon.png
  uninstallerIcon: public/vestibule/icon.png
